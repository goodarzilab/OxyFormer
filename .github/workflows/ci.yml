name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install numpy pandas pyarrow scipy scikit-learn pyyaml pytest geopandas rasterio shapely pyproj requests matplotlib
      - name: Run tests
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # pytest discovers tests at any depth; exit code 5 means no tests were collected yet.
          set +e
          PYTHONPATH=src python -m pytest -q
          rc=$?
          if [ "$rc" -eq 5 ]; then echo "no tests collected yet"; exit 0; fi
          exit "$rc"
