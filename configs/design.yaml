# task_path JSON: {"dependencies": {<role>: <absolute dependency path>}}.
# Every path must occur in StageRequest.dependency_paths/hashes.
# Roles: approvals (owner YAML), data_manifest (DataManifest),
# covariates (CovariateView, nuisance use), geography (GeographyTable),
# atlas (CollectedAtlas), entity_graph (EntityGraph).
# All scientific records use canonical Immutable envelopes and contain no Y.
# No production source fields or data are invented here. Reviewed adapters
# bind county, subblock, assignment geography and flag/availability metadata.
# Consumers use each resulting frozen DataManifest and validate its splits.
