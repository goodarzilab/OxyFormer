schema_version: 1
# SOURCE notes: these are ingestion mappings, not an approved adjustment registry,
# support policy, or a claim that biomarker nonresponse is ignorable.
source_notes:
  sentinel_convention: >-
    The 2023/2024 dictionaries omit the missing sentinels. Continuing HC53=999
    (missing information) and HC55=9 (missing/unspecified measurement status)
    into these releases is an inference from DHS and earlier INEI documentation,
    explicitly authorized by the orchestrator's continuation instruction under
    mandate item 2. BLANK/not applicable remains distinct. No other release's
    field mapping or adjustment is imported.
  sentinel_references:
    - 'DHS-7 Standard Recode Manual, 10 Sep 2018, Coding Standards p. 4: https://www.dhsprogram.com/pubs/pdf/DHSG4/Recode7_DHS_10Sep2018_DHSG4.pdf'
    - 'DHS-7 Recode Map, 31 Aug 2018, RECH6 p. 32: https://www.dhsprogram.com/pubs/pdf/DHSG4/Recode7_Map_31Aug2018_DHSG4.pdf'
    - 'INEI ENDES 2017 household dictionary, PDF p. 26: https://proyectos.inei.gob.pe/iinei/srienaho/Descarga/DocumentosMetodologicos/2017-5/DiccionarioHogar.pdf'
  measured_hb: >-
    INEI 2023 indicator notes, printed p. 153, specify HC55=0 and HC53/10.
    The indicator's anemia adjustment is never applied or reversed here.
  measured_hb_reference: https://proyectos.inei.gob.pe/endes/2023/ppr/PPR_2023_I_Fichas_Tecnicas.pdf
  population: >-
    The supported weight domain is the household child biomarker population.
    The full roster is retained. Adults, including women, are excluded from this
    domain; HV005 must not be used to claim a women's biomarker population.
    Both annual Ficha Tecnica documents, section 5.2, PDF page 9, explicitly
    describe HEMOGLOBIN collection beginning at four months, separately from
    anthropometry. This is not the six-month cutoff of anemia indicators.
    RECH6 covers children under five. Downstream frozen target/support
    restrictions remain the responsibility of the analysis design.
  eligibility_references:
    - https://proyectos.inei.gob.pe/endes/2023/DOCUMENTOS/FICHA_TECNICA_ENDES_2023.pdf
    - https://proyectos.inei.gob.pe/iinei/srienaho/Descarga/FichaTecnica/968-Ficha.pdf
    - https://proyectos.inei.gob.pe/iinei/srienaho/Descarga/DocumentosMetodologicos/2023-5/ManualAntropometrista.pdf
    - https://proyectos.inei.gob.pe/iinei/srienaho/Descarga/DocumentosMetodologicos/2024-5/ManualAntropometrista.pdf
  inference: >-
    HV005/1000000 is documented for under-five anemia, with HV001 clusters and
    HV022 strata. HV021 is also preserved. These normalized weight sums are not
    population counts. Unmeasured eligible children remain in the audit; complete
    cases do not establish identification for the full eligible population.
    No singleton correction, finite-population fraction or replicate-weight
    procedure is invented. HV033 is preserved without interpreting it as an FPC.
  exposure: >-
    HV040 is documented cluster altitude in metres. Quantified altitude
    uncertainty is not supplied by these dictionaries: altitude_uncertainty_m
    is null (unknown), never zero. This does not authorize a null altitude_m:
    a numeric HV040 value is a required exposure prerequisite. Missing HV040
    must block ingestion, since there is no approved alternative assignment.
    Exposure conversion/support assessment belongs downstream.
    No alternative exposure assignment is approved by this mapping.
  lineage: >-
    The 2024 technical sheet explicitly identifies shared HV001 numbers in
    2023/2024 as panels. Retain a common 2021-2024 panel namespace across years;
    household and person observations remain year-specific. Retain UBIGEO and
    frame-cluster identifiers. 2024 CSV headers use NCONGLOME1, although its
    dictionary calls the field NCONGLOME; the actual header is mapped explicitly.
