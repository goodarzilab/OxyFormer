# Inspected observation metadata only. This file grants NO source, exposure,
# population-selection or predictor approval. No real data or mappings live here.
# Each year is explicit; no profile inheritance or geography carry-forward.
# BirthMapping must pin profile_hash(), release.content_hash and SourceManifest.
# Existing owner approvals remain read-only. Future residence approval must bind
# owner_decisions.birth_exposure.<COL|ECU> = {status: approved, manifest_hash: <sha256>}
# to the complete ResidenceExposure.content_hash; there is currently no such grant.
# Optional population rules must be explicitly approved by their content hashes in
# owner_decisions.birth_population_exclusions. No default population exclusions.
# Reviewed SourceManifest.schema_hash uses ordered, nonnullable string ColumnSpecs
# for the CSV header. All raw cells are retained, even missing/invalid values.
# Status/period/geography information belongs in BirthRelease and is never guessed.
# ResidenceExposure source_kind and placement are reviewed semantic declarations,
# not guessed from URI text. US 3DEP and hospital/capital-city placement are refused.
# Structurally short/long CSV rows retain raw_cells; they block anchor fitting.
