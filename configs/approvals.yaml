# Owner approvals for the OxyFormer v2 run. Owner-originated: only the owner (or a PR the owner approves) may change this
# file. Units read it and never write it. Anything a unit needs that is not listed under `plan_fixed` or `owner_decisions`
# is NOT approved: the unit must stop and report rather than assume a value.
schema_version: 1
plan: docs/plan/OXYFORMER_V2_PLAN.md
approved_by: Hani Goodarzi
approved_on: 2026-10-04

# Parameters the frozen plan states explicitly (section numbers refer to docs/plan/OXYFORMER_V2_PLAN.md).
plan_fixed:
  tract_shift_mmhg: 2.0                  # sections 1 and 4.1
  policy_form: shift_or_stay             # section 4.1; no clipping, jitter or bridging of support gaps
  support_design_fraction: 0.20          # section 4.1: outcome-sealed geographic sub-blocks
  primary_outcome_flags: [1]             # sections 4.1 and 5.3: flag-1 USALEEP tracts; no flag-2/3 labels in primary training
  min_flag1_tracts_per_county: 4         # section 4.1
  min_inhabited_relief_m: 300            # section 4.1: inhabited P90-P10 tract-elevation contrast
  max_local_comparison_km: 25            # section 4.1
  min_outer_training_tracts_per_county: 8   # section 5.1
  min_inner_partition_tracts_per_county: 4  # section 5.1
  outer_folds: 5                         # section 5.1
  inner_folds: 3                         # section 5.2
  seeds: [1103, 2207, 3301]              # section 5.2
  transform_before_aggregate: true       # section 3.1
  location_terrain_satellite_inputs_in_nuisances: forbidden   # sections 2, 3.1 and 11
  county_membership: coarse_comparison_stratum                # section 3.1

# Decisions the owner made in the orchestrating session on 2026-10-04.
owner_decisions:
  foundation_models:
    tabicl: {package: "2.2.0", status: approved}
    tabpfn: {package: "9.1.0", versions: all, status: approved, note: "Arc is a nonprofit; research use"}
  sources_named_in_approved_issues:      # the 44-issue DAG the owner approved
    - usaleep_2010_2015
    - acs_2006_2010_5yr
    - elevcan_repository
    - census_2010_blocks_and_sf1
    - usgs_3dep
    - endes_2023
    - endes_2024
    - dane_births
    - inec_births
    - inegi_edr
    - conapo_municipal_population
  exposure_atlas_footprint: nine_census_divisions_contiguous_us_plus_dc   # atlas issues the owner approved
  # Approved by the owner on 2026-10-04 ("1-3 is done"). Occurrence year t keeps only deaths registered in years t through t+L.
  mexico_edr_registration_lag:
    primary: {lag_years: 2, registration_years: [2015, 2016, 2017, 2018, 2019, 2020, 2021]}   # occurrence years 2015-2019
    late_registration_check: {lag_years: 5, registration_years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]}
  access_rule: public_data_only           # applications (DHS, SEER Research Plus, UK Biobank, All of Us) are excluded
  # Approved by the owner on 2026-10-04 ("Let's go with your recommendations") after the source audit reported them missing.
  exposure:                               # plan section 3.1: elevation -> pressure before population aggregation
    dem_product: usgs_3dep_one_third_arc_second_seamless   # USGS StagedProducts/Elevation/13 (about 10 m), nine-division footprint
    # Approved by the owner on 2026-10-04 ("1-3 is done"), after the source audit found eight footprint cells with no current tile.
    dem_fallback: "USGS 3DEP 1 arc-second seamless DEM (StagedProducts/Elevation/1) for only the eight cells with no 1/3 arc-second tile, recorded per tile"
    pressure_model: international_standard_atmosphere_troposphere
    # P_B(z) = P0 * (1 - L*z/T0) ** (g0*M/(R*L)), z in metres above mean sea level; exponent about 5.2559
    sea_level_pressure_mmhg: 760.0        # P0
    sea_level_temperature_k: 288.15       # T0
    lapse_rate_k_per_m: 0.0065            # L
    # g0, M and R are the definitional constants of the approved standard-atmosphere formula (US Standard Atmosphere
    # 1976 values). The owner approved the formula and the three values above; the orchestrator recorded these three.
    gravity_m_per_s2: 9.80665             # g0
    molar_mass_air_kg_per_mol: 0.0289644  # M
    gas_constant_j_per_mol_k: 8.31432     # R* as defined by the 1976 standard, not the CODATA value
    inspired_o2_fraction: 0.2093
    water_vapour_pressure_mmhg: 47.0
    # P_IO2(z) = inspired_o2_fraction * (P_B(z) - water_vapour_pressure_mmhg); P_IO2,ref = P_IO2(0)
  manual_acquisition:
    usaleep_record_layout:              # approved and staged by the owner on 2026-10-04
      reason: "www.cdc.gov refuses non-browser clients and CDC's FTP mirror has no record layout. A person downloaded it by hand."
      file: Record_Layout_CensusTract_Life_Expectancy.pdf
      source_url: https://www.cdc.gov/nchs/data/nvss/usaleep/Record_Layout_CensusTract_Life_Expectancy.pdf
      staging_dir: /mnt/weka/home/hgoodarzi/oxyformer-swarm/staging/usaleep   # shared filesystem read by login and compute nodes
    dane_births_2023_2025:
      reason: "DANE microdata downloads sit behind a CAPTCHA. A person downloads them by hand; automation never bypasses the CAPTCHA."
      catalogs: [876, 878, 915]           # births 2023, 2024 and 2025 on microdatos.dane.gov.co
      staging_dir: /mnt/weka/home/hgoodarzi/oxyformer-swarm/staging/dane_births   # one subfolder per year; shared filesystem read by login and compute nodes
      fallback: "Colombia is dropped from month 1 if nobody can hand-download the DANE 2023-2025 birth files. The orchestrator records that determination here, and no further owner approval is needed. Files being absent from the staging folder do not by themselves meet this condition: a unit that finds them absent stops and reports to the orchestrator. After a drop, the birth anchor proceeds with INEC (Ecuador) alone, and the Peru ENDES hemoglobin anchor is unaffected."

  # Approved by the owner on 2026-10-04 ("I approve Covariate list") from the sign-off page
  # https://claude.ai/artifact/Y3H73yyAUDn81wkNu7JPbC (plan section 3.2). Approval covers this analysis registry. It does not
  # certify control of unmeasured confounding (smoking is not measured by any approved source) or a total lifelong
  # oxygen-exposure effect.
  endpoint_covariates:
    usaleep_life_expectancy:
      source: acs_2006_2010_5yr           # line n means estimate variable <table>_<nnn>E
      transforms:
        share: "sum of numerator lines / denominator line, in [0, 1]; standardized within training folds"
        income: "asinh(published value / 10000)"
      missing: "valid estimates are kept; a zero denominator is missing, never zero; imputation uses training folds only"
      margins_of_error: "kept as quality metadata, not predictors"
      concepts:
        female_share: {family: sex_composition, table: B01001, num: [26], den: 1, transform: share}
        age_under_18_share: {family: age_structure, table: B01001, num: [3, 4, 5, 6, 27, 28, 29, 30], den: 1, transform: share}
        age_18_34_share: {family: age_structure, table: B01001, num: [7, 8, 9, 10, 11, 12, 31, 32, 33, 34, 35, 36], den: 1, transform: share}
        age_35_44_share: {family: age_structure, table: B01001, num: [13, 14, 37, 38], den: 1, transform: share}
        age_45_54_share: {family: age_structure, table: B01001, num: [15, 16, 39, 40], den: 1, transform: share}
        age_55_64_share: {family: age_structure, table: B01001, num: [17, 18, 19, 41, 42, 43], den: 1, transform: share}
        age_65_plus_share: {family: age_structure, table: B01001, num: [20, 21, 22, 23, 24, 25, 44, 45, 46, 47, 48, 49], den: 1, transform: share}
        nh_white_share: {family: race_ethnicity, table: B03002, num: [3], den: 1, transform: share}
        nh_black_share: {family: race_ethnicity, table: B03002, num: [4], den: 1, transform: share}
        nh_aian_share: {family: race_ethnicity, table: B03002, num: [5], den: 1, transform: share}
        nh_asian_share: {family: race_ethnicity, table: B03002, num: [6], den: 1, transform: share}
        nh_nhpi_share: {family: race_ethnicity, table: B03002, num: [7], den: 1, transform: share}
        nh_other_race_share: {family: race_ethnicity, table: B03002, num: [8], den: 1, transform: share}
        nh_multiracial_share: {family: race_ethnicity, table: B03002, num: [9], den: 1, transform: share}
        hispanic_share: {family: race_ethnicity, table: B03002, num: [12], den: 1, transform: share}
        education_less_hs_share: {family: education, table: B15002, num: [3, 4, 5, 6, 7, 8, 9, 10, 20, 21, 22, 23, 24, 25, 26, 27], den: 1, transform: share}
        education_hs_only_share: {family: education, table: B15002, num: [11, 28], den: 1, transform: share}
        education_some_college_share: {family: education, table: B15002, num: [12, 13, 29, 30], den: 1, transform: share}
        education_associate_share: {family: education, table: B15002, num: [14, 31], den: 1, transform: share}
        education_bachelors_plus_share: {family: education, table: B15002, num: [15, 16, 17, 18, 32, 33, 34, 35], den: 1, transform: share}
        median_household_income: {family: material_resources, table: B19013, num: [1], transform: income}
        per_capita_income: {family: material_resources, table: B19301, num: [1], transform: income}
        household_income_lt_25k_share: {family: material_resources, table: B19001, num: [2, 3, 4, 5], den: 1, transform: share}
        household_income_25k_50k_share: {family: material_resources, table: B19001, num: [6, 7, 8, 9, 10], den: 1, transform: share}
        household_income_50k_100k_share: {family: material_resources, table: B19001, num: [11, 12, 13], den: 1, transform: share}
        household_income_100k_plus_share: {family: material_resources, table: B19001, num: [14, 15, 16, 17], den: 1, transform: share}
        poverty_ratio_lt_050_share: {family: material_resources, table: C17002, num: [2], den: 1, transform: share}
        poverty_ratio_050_099_share: {family: material_resources, table: C17002, num: [3], den: 1, transform: share}
        poverty_ratio_100_199_share: {family: material_resources, table: C17002, num: [4, 5, 6, 7], den: 1, transform: share}
        poverty_ratio_200_plus_share: {family: material_resources, table: C17002, num: [8], den: 1, transform: share}
      masking_families:                 # mask every member of a family together during self-supervised pretraining
        sex_composition: [female_share]
        age_structure: [age_under_18_share, age_18_34_share, age_35_44_share, age_45_54_share, age_55_64_share, age_65_plus_share]
        race_ethnicity: [nh_white_share, nh_black_share, nh_aian_share, nh_asian_share, nh_nhpi_share, nh_other_race_share, nh_multiracial_share, hispanic_share]
        education: [education_less_hs_share, education_hs_only_share, education_some_college_share, education_associate_share, education_bachelors_plus_share]
        material_resources: [median_household_income, per_capita_income, household_income_lt_25k_share, household_income_25k_50k_share, household_income_50k_100k_share, household_income_100k_plus_share, poverty_ratio_lt_050_share, poverty_ratio_050_099_share, poverty_ratio_100_199_share, poverty_ratio_200_plus_share]
      preregistered_sensitivities:
        - drop the material-resources block
        - drop the demographic block
      additions: "any addition needs a documented causal-role amendment"
      exclusions: "every variable not listed above is excluded"

  # Approved by the owner on 2026-10-04 ("Approved on both"): the conditional-support recipe in PR #15 (design-splits).
  # Plan section 4.1 asks for conservative conditional intervals frozen from the outcome-blind design set; these are its settings.
  design_support_recipe:
    bin_width_mmhg: 1.0                 # exposure bins; replicated interior bins only, the two outermost bins are discarded
    min_bin_tracts: 2                   # distinct design-set tracts required in every bin along the shift path
    raw_x_radius_iqr: 1.0               # comparison neighbors: same county, within 25 km, within 1 IQR on every approved covariate
    revisit_rule: "The outcome-blind tract gate will show the supported tract count before any outcome is used. If support is too thin, these values can still be widened then."
  # Approved by the owner on 2026-10-06 ("Let's go with your recommendations") after tract-tasks found that the tract support
  # gate's geography and atlas-to-design inputs were not defined by the frozen plan (sections 3.1 and 4.1) or by this file.
  tract_design:
    placement_scenario: distributed     # the gate's exposure and inhabited elevation use the distributed allocation; centroid stays a sensitivity
    exposure_field: oxygen_deficit_mmhg # tract A_t (section 3.1) under the distributed scenario
    inhabited_elevation: p50            # tract median of population-allocated elevation under the distributed scenario; county relief = P90 - P10 across its tracts' values
    allocation_qualified: complete_distributed_exposure   # a tract qualifies only if its distributed-scenario exposure is complete; never imputed
    coordinates: population_weighted_2010_block_centroid  # 2010 Census block populations and block internal points from the census acquisition
    subblock: county_x_10km_grid_epsg5070                 # (county, 10 km EPSG:5070 grid cell, origin (0, 0), containing the tract coordinate)
    assignment_geography: tract         # each tract is its own exposure-assignment geography (section 4.1)
  # Approved by the owner on 2026-10-04 ("Approved on both") from the sign-off page https://claude.ai/artifact/1FxDYK6hp2C2A2j5wd2rYz.
  birth_anchor_recipe:
    exposure:
      elevation: NASADEM_HGT.001 merged 1 arc-second DEM, metres relative to EGM96   # public domain (CC0)
      population_weights: "GHS-POP R2023A 100 m counts: epoch 2020 for Colombia 2023-2025 and Ecuador 2024; epoch 2015 for Ecuador 2015; European Commission reuse notice with attribution"
      boundaries:
        COL: DANE MGN 2024 municipality polygons (DIVIPOLA code mpio_cdpmp), CC BY 4.0, with a reviewed concordance per birth year
        ECU: held until an openly licensed INEC parish polygon file is verified (canton as fallback)
      placement: maternal_residence_population_weighted   # municipality (COL); parish, else canton (ECU); no points, seats or hospitals
      residence_fields: {COL: [CODPTORE, CODMUNRE], ECU: [prov_res, cant_res, parr_res]}
      computation: "elevation -> pressure -> P_IO2 deficit at each fine location with owner_decisions.exposure constants, before population averaging"
      unmatched_codes: unmatched or ambiguous area codes stop the run; boundary changes need a reviewed crosswalk
    covariates:
      primary: {COL: [EDAD_MADRE, NIV_EDUM], ECU: [edad_mad, niv_inst, etnia]}
      sensitivity: {COL: [EST_CIVM], ECU: [est_civil]}
      excluded: [gestational age, prenatal visits, delivery type, APGAR, newborn length, hospital or occurrence or registration geography, reproductive-history counts, COL IDPERTET as maternal ethnicity]
      area_level_sensitivity: {COL: municipal unmet basic needs (NBI) 2018, ECU: deferred}
      coding: "subject to year-specific coding checks and reviewed geographic concordances; COL EDAD_MADRE (age at delivery) kept as categories; COL NIV_EDUM nominal, not years of schooling; ECU 2015 runs only after its codes and historical geography are verified"
    data_terms: "DANE birth microdata are free and public but may not be redistributed without written permission; the run keeps payloads in attempt folders and never commits or shares them"
    interpretation: "consistency of a residence-pressure association with birth outcomes, not oxygen-specific identification"

  # Approved by the owner on 2026-10-04 ("I regardless approve what you listed above"): plan section 6.4's proposed gates as
  # written, and an influence-concentration gate drafted with gpt-6-astra for the metric the plan names but does not define.
  release_gates:
    min_repetitions_per_scenario: 1000        # for selected final scenarios: independent repetitions using the production tuning and stopping procedure
    coverage_one_sided_95_lower_bound_min: 0.925
    null_rejection_upper_bound_max: 0.075
    abs_bias_over_empirical_sd_target: 0.10      # a target, not a hard maximum
    abs_bias_over_empirical_sd_investigate_above: 0.20
    mean_se_over_empirical_sd_range: [0.90, 1.10]
    numerical_failure_upper_bound_max: 0.01
    publish_all_failures_and_registered_retry_rules: true
  influence_concentration_gate:
    applies_to: [one_step, cv_tmle]          # each estimator separately, from final seed-aggregated contributions
    definitions: "U_g = sum of u_i over county g (unkernelized); D = sum_g U_g^2; s_g = U_g^2 / D; s_max = max_g s_g; G_eff = 1 / sum_g s_g^2"
    s_max_max: 0.10
    g_eff_min: 30
    require: "D > 0 and every contribution finite"
    on_failure: "block confirmatory release; publish the estimate as diagnostic-only with s_max, G_eff and ranked county contributions; never trim counties, cap ratios or reweight post hoc"

# Not yet approved. A unit that needs one of these must stop and report; the orchestrator brings it to the owner.
pending_owner_approval:
  - any relief, flag or distance sensitivity analyses beyond plan_fixed
