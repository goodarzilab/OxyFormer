# Input-type contract (all domain endpoints denote their exact binary values):
# Python int/float and NumPy integer/floating scalars of every width are accepted.
# Lists, tuples and arrays may mix these types; each supplied element is captured
# before NumPy promotion and checked exactly. Existing numeric arrays supply
# their stored values; callers must use object arrays to retain mixed precision.
# Boolean, complex, string, nonfinite and out-of-domain numbers are refused.
# Configuration, frames, paired-world/truth/uncertainty records and assignment support endpoints
# use the shared JSON binary64 schema: every input must be representable there
# without loss, otherwise a specific representability error is raised. Policy
# objects come from the authoritative ShiftOrStayPolicy API and supply its
# already-serialized values. In contrast, exact_shift_intervals is a raw
# rational geometry helper: it retains supported real endpoints/delta exactly
# and never serializes them into binary64 records.
# Intervention doses and positive integration tolerances retain their exact
# supplied values and need not fit binary64. Seeds, row indices, pair sizes and
# max_order accept any supported scalar type representing an exact integer.
# Counts/seeds keep their existing bounds; integration max_order is at least 32.
# Domain/physical sign checks never use a value rounded from a raw input.
# Integration convergence includes the exact displacement from rounding the
# computed truth to its binary64 artifact; no output-ULP tolerance floor applies.
# Fixed numeric input domain; no clipping, rescaling, or computation outside it.
# Start with the smallest per-quantity box for the 14 registered recipes plus
# the exact-location pair and shared reference inputs. Widen every magnitude
# bound by AT LEAST 100x. Zero remains valid for signed quantities and disabled
# mechanisms, zero weights and identity shifts. Probability constraints still
# apply. Wider axes retain the inherited successful numerical stress tests:
# tiny near scales/weights use scaled/log arithmetic; paired interventions use
# exact rational arithmetic. These extensions do not widen nonlinear-response
# coefficients or the positive shift floor. This is not all-float64 support.
# Shared reference inputs: X in [-1,1], coordinates in [0,10], unit weights;
# supports have endpoints in [0,10], delta=2; near centers lie within supports.
# Coefficient box covers beta and local/regional strengths. Paired c and tau
# have separate bounds because they use a different response implementation.
# Gaussian innovations and computed responses are outputs, not bounded inputs.
numeric_domain:
  id: suite-a-100x-v1
  margin: 100.0
  # Union these disabled values with the positive intervals in supported_box.
  # noise_sd=0 is a deliberate noiseless simulation, not an invalid scale.
  zero_exceptions:
  - delta
  - denominator_error
  - exposure_error
  - migration
  - noise_sd
  - weight
  registered_box:
    dose:
    - 0.0
    - 10.0
    delta:
    - 2.0
    - 2.0
    near_scale:
    - 0.05
    - 0.05
    coefficient:
    - -2.0
    - 2.0
    noise_sd:
    - 1.0
    - 1.0
    exposure_error:
    - 0.4
    - 0.4
    migration:
    - 2.0
    - 2.0
    registration_probability:
    - 0.65
    - 1.0
    denominator_error:
    - 0.2
    - 0.2
    coordinate:
    - 0.0
    - 10.0
    covariate:
    - -1.0
    - 1.0
    weight:
    - 1.0
    - 1.0
    paired_c:
    - -1.5
    - 1.5
    paired_tau:
    - -2.0
    - 2.0
    intervention_dose:
    - 0.0
    - 10.0
  supported_box:
    dose:
    - -10010.0
    - 10010.0
    delta:
    - 0.02
    - 200.0
    near_scale:
    - 5.0e-324
    - 1000.0
    coefficient:
    - -200.0
    - 200.0
    noise_sd:
    - 0.01
    - 100.0
    exposure_error:
    - 0.004
    - 40.0
    migration:
    - 0.02
    - 200.0
    registration_probability:
    - 0.006500000000000001
    - 100.0
    denominator_error:
    - 0.002
    - 20.0
    coordinate:
    - -1000.0
    - 1000.0
    covariate:
    - -100.0
    - 100.0
    weight:
    - 5.0e-324
    - 1.7e+308
    paired_c:
    - -1.0e+307
    - 1.0e+307
    paired_tau:
    - -1.0e+300
    - 1.0e+300
    intervention_dose:
    - -1.0e+308
    - 1.0e+308
suite: A
scenario_expansion: explicit_only
# Synthetic recipe. A caller supplies approved fixed covariates and frozen
# ShiftOrStayPolicy support; no real records or inferred policy IDs live here.
# All baseline values/defaults are validated by SCMConfig. active_mechanisms
# must equal the exact enabled switch set, including the effect family.
truth_population: fixed_covariate_frame_with_factual_selection
truth_adjustment: approved_X_missingness_support_stratum_region_and_measured_confounders
structural_intervention: increment_true_dose_by_recorded_policy_shift_hold_selection_fixed
truth_store: evaluator_only_separate_from_observations
suite_b: interface_only_follow_on
scenarios:
  - name: null_effect
    effect: "null"
    active_mechanisms: ["null"]
  - name: linear_reference
    active_mechanisms: [linear]
  - name: nonlinear
    effect: nonlinear
    active_mechanisms: [nonlinear]
  - name: sign_changing
    effect: sign_changing
    active_mechanisms: [sign_changing]
  - name: measured_local_regional
    local_confounding: measured
    regional_confounding: measured
    active_mechanisms: [linear, local_measured, regional_measured]
  - name: omitted_local_regional
    local_confounding: omitted
    regional_confounding: omitted
    active_mechanisms: [linear, local_omitted, regional_omitted]
  - name: near_location
    assignment: near_deterministic
    active_mechanisms: [linear, near_deterministic]
  - name: disconnected_support
    support_gaps: true
    active_mechanisms: [linear, support_gaps]
  - name: heterogeneous_eligibility
    heterogeneous_eligibility: true
    active_mechanisms: [linear, heterogeneous_eligibility]
  - name: unsupported_atoms
    assignment: atoms
    active_mechanisms: [linear, atoms]
  - name: extreme_ratios
    extreme_ratios: true
    active_mechanisms: [linear, extreme_ratios]
  - name: error_migration_selection
    exposure_error: 0.4
    migration: 2.0
    selected_outcome: true
    active_mechanisms: [linear, exposure_error, migration, selected_outcome]
  - name: survey_biomarker_missingness
    survey_inclusion: true
    missing_biomarkers: true
    active_mechanisms: [linear, survey_inclusion, missing_biomarkers]
  - name: registration_denominator
    registration_probability: 0.65
    denominator_error: 0.2
    active_mechanisms: [linear, under_registration, denominator_error]
# The mandatory exact-location pair is generated by
# observational_equivalence_pair(), with common S, X and epsilon and one Y.
# It is separate from fixed-frame continuous assignment scenarios: S is random
# under its known population law, while it is held fixed under interventions.
