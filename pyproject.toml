[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oxyformer"
version = "0.1.0"
description = "OxyFormer scientific artifact contracts"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
# Separate oxyformer-p3 clone; complete package list: requirements/oxyformer-p3-conda.txt
run-logging = ["wandb==0.30.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["oxyformer*"]
namespaces = true
